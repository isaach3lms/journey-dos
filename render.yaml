# Render Blueprint for journey-dos.
#
# Five resources, one file:
#   1. journey-dos-demo    the static client demo, unchanged, still free
#   2. journey-dos-app     the Flask application
#   3. journey-dos-worker  the continuous sender, seconds
#   4. journey-dos-outbox  the five minute cron, the safety net under it
#   5. journey-dos-db      Postgres
#
# Two senders on purpose. See the comment above the worker.
#
# Render reads this on every push. Creating services by hand in the dashboard
# instead means the configuration lives in a browser tab nobody else can see.

databases:
  - name: journey-dos-db
    databaseName: journey_dos
    user: journey_dos
    plan: basic-256mb          # See README before choosing free.
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------
  # The approved client demo. Static, no build step, no runtime.
  # ---------------------------------------------------------------------
  - type: web
    name: journey-dos-demo
    runtime: static
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow

  # ---------------------------------------------------------------------
  # The application.
  # ---------------------------------------------------------------------
  - type: web
    name: journey-dos-app
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    # Migrations run after the build and before traffic cuts over, so a
    # failed migration fails the deploy instead of half-migrating live users.
    #
    # This was off for a week while an unrelated migration failure was
    # diagnosed, and in that week two separate deploys shipped code whose
    # schema had not been applied. Both looked like a 500 on one tab with
    # nothing to connect it to a schema change. Leaving this on is worth more
    # than the one time it made a failure harder to read.
    #
    # If a migration fails again: comment this out, deploy, then run
    # `flask db upgrade` in the shell where the whole error is readable.
    # `/readyz` reports a pending migration either way.
    preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: journey-dos-db
          property: connectionString
      # The apex the tenant subdomains hang off. Leave empty until the
      # platform domain is bought, and reach tenants by custom domain in
      # the meantime. See README, "The domain decision".
      - key: PLATFORM_DOMAIN
        value: ""
      - key: DEFAULT_TENANT_SLUG
        value: journey
      - key: MAIL_TRANSPORT
        value: resend
      # Set this in the dashboard, never in this file. A key committed to git
      # is a rotated key. Use a sending-only key, not a full-access one.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: The Journey Church <no-reply@thejourneychurchsemo.com>
      # Push is off until the keys exist. Turning it on without them makes
      # the service refuse to boot, which is the guard working correctly and a
      # terrible out-of-the-box experience.
      #
      # Set in the dashboard, not here, so switching push on is three values
      # typed in one place rather than a code change and a deploy. Leaving it
      # unset means off, which is the right default for a church that has not
      # generated keys.
      #
      # To switch it on:
      #   1. Render dashboard, this service, Shell: flask vapid-keys
      #   2. set VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY from its output
      #   3. set PUSH_TRANSPORT to: webpush
      #
      # Set all three on BOTH services, the web one and the cron one, and set
      # them on the web service last: the moment it restarts with webpush and
      # no private key it refuses to boot.
      #
      # The public key is not a secret; the private one is. Settings shows
      # whether each is present, never what it holds.
      - key: PUSH_TRANSPORT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  # ---------------------------------------------------------------------
  # The continuous sender.
  #
  # A notification has to arrive in seconds or it is not a notification.
  # The cron job below runs every five minutes, which is right for email
  # and useless for a phone buzzing about a message somebody has already
  # read. Before this service existed, push was sent inside the web
  # request to get that speed: one HTTPS call per device, per person in
  # the room, with the author waiting through every one of them. The
  # visible result was a church thread with the same message in it six
  # times, because a send button that looks untouched gets pressed again.
  #
  # It drains both queues, not just push. Email arriving in two seconds
  # instead of up to five minutes is free once something is already
  # looking.
  #
  # Costs $7/month. The cron below stays anyway: see its comment.
  # ---------------------------------------------------------------------
  - type: worker
    name: journey-dos-worker
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    # Never exits. Render restarts it if it does.
    startCommand: flask worker-loop
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        fromService:
          type: web
          name: journey-dos-app
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: journey-dos-db
          property: connectionString
      - key: MAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: The Journey Church <no-reply@thejourneychurchsemo.com>
      # The same three as everywhere else, set in the dashboard. This
      # service is the one that actually sends notifications now, so if
      # these are missing here, nothing arrives on anybody's phone even
      # though the app and the cron look healthy.
      - key: PUSH_TRANSPORT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  # ---------------------------------------------------------------------
  # The five minute cron, which is now the safety net rather than the
  # only sender.
  #
  # Kept after the continuous worker arrived, deliberately. The worker is
  # a single process: it can hang on a socket, die in a way Render is
  # slow to notice, or be mid-build during a deploy. When that happens
  # this still drains both queues within five minutes, which is the
  # difference between a notification being late and a church finding out
  # in March that nothing has sent since February. Claiming is atomic, so
  # the two senders never take the same row.
  #
  # It also owns the work that belongs on a five minute timer either way:
  # sequences, releasing abandoned claims, and the purges.
  #
  # Billed per second of runtime, which is cents a month.
  # ---------------------------------------------------------------------
  - type: cron
    name: journey-dos-outbox
    runtime: python
    plan: starter
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    # One command that runs every step in order: sequences queue, abandoned
    # claims are released, the outbox sends, then housekeeping. Each step is
    # isolated, so one failing never stops email from going out. It used to
    # be a chain joined with &&, where any early failure stopped all sending.
    startCommand: flask worker-tick
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        fromService:
          type: web
          name: journey-dos-app
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: journey-dos-db
          property: connectionString
      - key: MAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: The Journey Church <no-reply@thejourneychurchsemo.com>
      # Push is off until the keys exist. Turning it on without them makes
      # the service refuse to boot, which is the guard working correctly and a
      # terrible out-of-the-box experience.
      #
      # Set in the dashboard, not here, so switching push on is three values
      # typed in one place rather than a code change and a deploy. Leaving it
      # unset means off, which is the right default for a church that has not
      # generated keys.
      #
      # To switch it on:
      #   1. Render dashboard, this service, Shell: flask vapid-keys
      #   2. set VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY from its output
      #   3. set PUSH_TRANSPORT to: webpush
      #
      # Set all three on BOTH services, the web one and the cron one, and set
      # them on the web service last: the moment it restarts with webpush and
      # no private key it refuses to boot.
      #
      # The public key is not a secret; the private one is. Settings shows
      # whether each is present, never what it holds.
      - key: PUSH_TRANSPORT
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
