{% extends "base.html" %}
{% block title %}Set your password | {{ brand.church_name }}{% endblock %}
{% block body %}
<section class="section">
  <div class="narrow">
    <p class="eyebrow dark">Your account</p>
    <h1>Set your password</h1>
    {% if error %}<div class="flash">{{ error }}</div>{% endif %}
    <form class="form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="password">New password</label><input type="password" id="password" name="password" required minlength="8" autofocus></div>
      <div class="field"><label for="confirm">Type it again</label><input type="password" id="confirm" name="confirm" required minlength="8"></div>
      <div><button class="btn gold" type="submit">Save and sign in</button></div>
    </form>
  </div>
</section>
{% endblock %}
