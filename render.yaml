# Render Blueprint for journey-dos.
#
# Three resources, one file:
#   1. journey-dos-demo   the static client demo, unchanged, still free
#   2. journey-dos-app    the Flask application
#   3. journey-dos-db     Postgres
#
# Render reads this on every push. Creating services by hand in the dashboard
# instead means the configuration lives in a browser tab nobody else can see.

databases:
  - name: journey-dos-db
    databaseName: journey_dos
    user: journey_dos
    plan: basic-256mb          # See README before choosing free.
    postgresMajorVersion: "16"

services:
  # ---------------------------------------------------------------------
  # The approved client demo. Static, no build step, no runtime.
  # ---------------------------------------------------------------------
  - type: web
    name: journey-dos-demo
    runtime: static
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow

  # ---------------------------------------------------------------------
  # The application.
  # ---------------------------------------------------------------------
  - type: web
    name: journey-dos-app
    runtime: python
    plan: starter
    branch: main
    buildCommand: pip install -r requirements.txt
    # TEMPORARILY OFF.
    #
    # This normally runs migrations after the build and before traffic cuts
    # over, so a failed migration fails the deploy instead of half-migrating
    # live users. That is the right default and it should go back on.
    #
    # It is off right now because a migration failure and a deploy failure are
    # the same event, which means a broken migration also blocks every code
    # change behind it and hides its own error in a truncated deploy log. With
    # it off: the deploy succeeds, then `flask db upgrade` runs in the shell
    # where the whole error is readable.
    #
    # While it is off, `/readyz` returns 503 with the pending revision, so a
    # half-deployed state is visible rather than silent.
    #
    # preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: journey-dos-db
          property: connectionString
      # The apex the tenant subdomains hang off. Leave empty until the
      # platform domain is bought, and reach tenants by custom domain in
      # the meantime. See README, "The domain decision".
      - key: PLATFORM_DOMAIN
        value: ""
      - key: DEFAULT_TENANT_SLUG
        value: journey
      - key: MAIL_TRANSPORT
        value: resend
      # Set this in the dashboard, never in this file. A key committed to git
      # is a rotated key. Use a sending-only key, not a full-access one.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: The Journey Church <no-reply@thejourneychurchsemo.com>
      # Push is off until the keys exist. Turning it on without them makes
      # the service refuse to boot, which is the guard working correctly and a
      # terrible out-of-the-box experience.
      #
      # To switch it on:
      #   1. flask vapid-keys           (in the shell, once)
      #   2. set VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY in the dashboard
      #   3. change this value to: webpush
      #
      # The public key is not a secret; the private one is. Set the private key
      # in the dashboard rather than here, and never commit it.
      - key: PUSH_TRANSPORT
        value: "null"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  # ---------------------------------------------------------------------
  # The outbox worker.
  #
  # A cron job on the same image, not a background thread in the web
  # service. A thread dies with the process on every deploy and every
  # restart, and takes whatever it had claimed with it. A separate
  # invocation either runs or visibly does not.
  # ---------------------------------------------------------------------
  - type: cron
    name: journey-dos-outbox
    runtime: python
    plan: starter
    branch: main
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    # Sequences queue first, then the outbox sends. Two steps in one job so
    # a step that falls due is emailed in the same five minute window.
    startCommand: flask run-sequences && flask send-outbox && flask release-claims --minutes 15 && flask purge-reset-tokens && flask purge-audit && flask purge-push
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_APP
        value: wsgi.py
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        fromService:
          type: web
          name: journey-dos-app
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: journey-dos-db
          property: connectionString
      - key: MAIL_TRANSPORT
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: The Journey Church <no-reply@thejourneychurchsemo.com>
      # Push is off until the keys exist. Turning it on without them makes
      # the service refuse to boot, which is the guard working correctly and a
      # terrible out-of-the-box experience.
      #
      # To switch it on:
      #   1. flask vapid-keys           (in the shell, once)
      #   2. set VAPID_PUBLIC_KEY and VAPID_PRIVATE_KEY in the dashboard
      #   3. change this value to: webpush
      #
      # The public key is not a secret; the private one is. Set the private key
      # in the dashboard rather than here, and never commit it.
      - key: PUSH_TRANSPORT
        value: "null"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
