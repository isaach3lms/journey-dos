{% extends "base.html" %}
{% block title %}Sign in | {{ brand.church_name }}{% endblock %}
{% block body %}
<section class="section">
  <div class="narrow">
    <p class="eyebrow dark">Your account</p>
    <h1>Sign in</h1>
    <form class="form" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field"><label for="email">Email</label><input type="email" id="email" name="email" required></div>
      <div class="field"><label for="password">Password</label><input type="password" id="password" name="password" required></div>
      <div><button class="btn forest" type="submit">Sign in</button></div>
    </form>
    <p class="muted" style="margin-top:1.2rem">
      First time here, or forgot your password?
      <a href="{{ url_for('auth.claim') }}">Get a sign in link</a>.
    </p>
  </div>
</section>
{% endblock %}
