{% extends "base.html" %}
{% block title %}Page not found | {{ brand.church_name }}{% endblock %}
{% block body %}
<section class="section forest" style="min-height:52vh;display:flex;align-items:center">
  <div class="wrap">
    <p class="eyebrow">404</p>
    <h1>That page is not on the map</h1>
    <p style="color:rgba(242,240,231,.78)">The link is broken or the page moved.</p>
    <a class="btn gold" href="{{ config.PUBLIC_SITE_URL }}">Back to the website</a>
  </div>
</section>
{% endblock %}
