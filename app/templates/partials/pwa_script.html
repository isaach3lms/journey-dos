{# Registers the service worker, and tells it to forget everything personal
   when somebody signs out. A church tablet and a family iPad are both shared
   devices. #}
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('{{ url_for("pwa.service_worker") }}');
    });
  }
  document.querySelectorAll('form[action$="/auth/logout"]').forEach(function (form) {
    form.addEventListener('submit', function () {
      if (navigator.serviceWorker && navigator.serviceWorker.controller) {
        navigator.serviceWorker.controller.postMessage('clear-personal-cache');
      }
    });
  });
</script>
