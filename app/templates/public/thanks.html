{% extends "base.html" %}
{% block title %}Thank you | {{ brand.church_name }}{% endblock %}
{% block body %}
<section class="section forest" style="min-height:52vh;display:flex;align-items:center">
  <div class="wrap">
    <p class="eyebrow">{{ brand.launch_line }}</p>
    <h1>{{ c.thanks_heading }}</h1>
    <p style="max-width:44ch;color:rgba(242,240,231,.78)">{{ c.thanks_body }}</p>
    <div style="margin-top:1.6rem">
      <a class="btn gold" href="{{ url_for('public.give') }}">Give toward the launch</a>
      <a class="btn ghost" href="{{ url_for('public.home') }}">Back home</a>
    </div>
  </div>
</section>
{% endblock %}
