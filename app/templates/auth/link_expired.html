{% extends "base.html" %}
{% block title %}Link expired | {{ brand.church_name }}{% endblock %}
{% block body %}
<section class="section">
  <div class="narrow">
    <p class="eyebrow dark">Your account</p>
    <h1>That link is done</h1>
    <p class="muted">Account links work once and expire after 48 hours. Ask for a fresh one and it will be in your inbox in a moment.</p>
    <a class="btn gold" href="{{ url_for('auth.claim') }}">Send me a new link</a>
  </div>
</section>
{% endblock %}
