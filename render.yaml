# Render Blueprint. Create this service FROM the Blueprint, never by hand.
# A manually created service never reads this file and its Environment tab
# comes up empty, which is a full afternoon lost to a problem with no error.
#
# Verify current plan names in the Render dashboard before the first apply.
# They change, and an invalid plan fails the apply with a vague message.

databases:
  - name: dos-db
    databaseName: dos
    user: dos
    plan: basic-256mb
    postgresMajorVersion: "16"

services:
  - type: web
    name: dos-app
    runtime: python
    plan: starter
    region: ohio
    branch: main
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask db upgrade
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 60 --access-logfile - --error-logfile -
    healthCheckPath: /livez
    envVars:
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: FLASK_APP
        value: wsgi.py
      - key: SECRET_KEY
        generateValue: true
      - key: PLATFORM_DOMAIN
        value: dos.betweensundaysconsulting.com
      - key: DATABASE_URL
        fromDatabase:
          name: dos-db
          property: connectionString
