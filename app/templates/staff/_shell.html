<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Staff | {{ brand.church_name }}{% endblock %}</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family={{ brand.type.display }}:wght@{{ brand.type.display_weights }}&family={{ brand.type.body }}:wght@{{ brand.type.body_weights }}&display=swap" rel="stylesheet">
<style>:root{ {{ brand_css }} }</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
<div class="shell">
  <aside class="side">
    <img src="{{ url_for('static', filename=brand.logo_white) }}" alt="{{ brand.church_name }}">
    <a class="{{ 'on' if request.endpoint == 'staff.dashboard' }}" href="{{ url_for('staff.dashboard') }}">Dashboard</a>
    <a class="{{ 'on' if request.endpoint in ('staff.people','staff.person') }}" href="{{ url_for('staff.people') }}">People</a>
    <a class="{{ 'on' if request.endpoint == 'staff.giving' }}" href="{{ url_for('staff.giving') }}">Giving</a>
    <a class="{{ 'on' if request.endpoint == 'staff.automations' }}" href="{{ url_for('staff.automations') }}">Automations</a>
    <a href="{{ url_for('public.home') }}">View site</a>
    <div class="spacer"></div>
    <a href="{{ url_for('auth.logout') }}">Sign out</a>
  </aside>
  <main class="main">
    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}{% endif %}
    {% endwith %}
    {% block main %}{% endblock %}
  </main>
</div>
</body>
</html>
