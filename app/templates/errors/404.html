<!doctype html>
<html lang="en">
{# Standalone for the same reason as 500.html: an unknown host has no tenant,
   so there is nothing for base.html to render. #}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <style>
    {{ safe_css }}
    body{margin:0;font-family:var(--font-sans);background:var(--surface-2);color:var(--text)}
    .box{max-width:560px;margin:14vh auto;padding:32px;background:var(--surface);
         border:1px solid var(--line);border-radius:var(--radius)}
    h1{font-size:22px;margin:0 0 10px}
    p{color:var(--muted);font-size:15px;line-height:1.6;margin:0}
  </style>
</head>
<body>
  <div class="box">
    <h1>We could not find that page</h1>
    <p>Check the address, or go back to where you were.</p>
  </div>
</body>
</html>
