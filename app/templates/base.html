<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ church.name if church else "Discipleship Operating System" }}{% endblock %}</title>
  {#
    Brand tokens are injected here and nowhere else. Templates below this line
    reference var(--accent), never a hex value. Reskinning a client is a row
    update on church.accent_hex.
  #}
  <style>{{ brand_css }}</style>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <span class="mark" aria-hidden="true"></span>
      <span class="churchname">{{ church.name if church else "" }}</span>
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
